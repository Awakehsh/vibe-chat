name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: ./packages/cli/dist/vibechat --version
        if: runner.os != 'Windows'
      - run: ./packages/cli/dist/vibechat.exe --version
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v7
        with:
          name: vibechat-${{ matrix.os }}
          path: packages/cli/dist/vibechat*
