name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            name: vibechat-darwin-arm64
          - os: macos-13
            target: bun-darwin-x64
            name: vibechat-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            name: vibechat-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            name: vibechat-linux-arm64
          - os: windows-latest
            target: bun-windows-x64
            name: vibechat-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun build --compile --minify --target=${{ matrix.target }} packages/cli/src/index.ts --outfile dist/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
