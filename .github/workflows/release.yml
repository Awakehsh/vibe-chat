name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            name: vibechat-darwin-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            name: vibechat-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            name: vibechat-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            name: vibechat-linux-arm64
          - os: windows-latest
            target: bun-windows-x64
            name: vibechat-windows-x64.exe
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun build --compile --minify --target=${{ matrix.target }} packages/cli/src/index.ts --outfile dist/${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and Homebrew formula
        run: |
          cd dist && sha256sum vibechat-* > checksums.txt && cd ..
          bun scripts/brew-formula.ts "${GITHUB_REF_NAME#v}" dist/checksums.txt > dist/vibechat.rb
          bun scripts/scoop-manifest.ts "${GITHUB_REF_NAME#v}" dist/checksums.txt > dist/vibechat.json
          ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/vibechat-*
            dist/checksums.txt
            dist/vibechat.rb
            dist/vibechat.json
          generate_release_notes: true

