name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            name: vibechat-darwin-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            name: vibechat-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            name: vibechat-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            name: vibechat-linux-arm64
          - os: windows-latest
            target: bun-windows-x64
            name: vibechat-windows-x64.exe
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun build --compile --minify --target=${{ matrix.target }} packages/cli/src/index.ts --outfile dist/${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and Homebrew formula
        run: |
          cd dist && sha256sum vibechat-* > checksums.txt && cd ..
          bun scripts/brew-formula.ts "${GITHUB_REF_NAME#v}" dist/checksums.txt > dist/vibechat.rb
          bun scripts/scoop-manifest.ts "${GITHUB_REF_NAME#v}" dist/checksums.txt > dist/vibechat.json
          ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/vibechat-*
            dist/checksums.txt
            dist/vibechat.rb
            dist/vibechat.json
          generate_release_notes: true

      # The tap and the bucket live in their own repositories, so this needs a
      # token that can write to them; without the secret the release still
      # publishes and the two files are updated by hand from its assets.
      - name: Publish the Homebrew formula and the Scoop manifest
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ github.ref_name }}
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          set -euo pipefail
          publish() {
            repo=$1 path=$2 src=$3 dir=$(mktemp -d)
            git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${OWNER}/${repo}.git" "$dir"
            install -D "$src" "$dir/$path"
            git -C "$dir" add "$path"
            git -C "$dir" diff --cached --quiet && { echo "$repo already at ${VERSION#v}"; return; }
            git -C "$dir" -c user.name="github-actions[bot]" \
                          -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                          commit -m "vibechat ${VERSION#v}"
            git -C "$dir" push
          }
          publish homebrew-tap Formula/vibechat.rb dist/vibechat.rb
          publish scoop-bucket bucket/vibechat.json dist/vibechat.json
