name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            name: vibechat-darwin-arm64
          - os: macos-13
            target: bun-darwin-x64
            name: vibechat-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            name: vibechat-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            name: vibechat-linux-arm64
          - os: windows-latest
            target: bun-windows-x64
            name: vibechat-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun build --compile --minify --target=${{ matrix.target }} packages/cli/src/index.ts --outfile dist/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and Homebrew formula
        run: |
          cd dist && sha256sum vibechat-* > checksums.txt && cd ..
          bun scripts/brew-formula.ts "${GITHUB_REF_NAME#v}" dist/checksums.txt > dist/vibechat.rb
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vibechat-*
            dist/checksums.txt
            dist/vibechat.rb
          generate_release_notes: true

  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist/bin
          merge-multiple: true
      - name: Build platform packages
        run: bun scripts/npm-platform-packages.ts "${GITHUB_REF_NAME#v}" dist/bin dist/npm
      - name: Publish
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for d in dist/npm/*/; do (cd "$d" && npm publish --access public); done
          (cd packages/npm/vibe-chat && npm publish --access public)
      - name: Skipped
        if: env.NODE_AUTH_TOKEN == ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "NPM_TOKEN secret not set; npm publish skipped"
